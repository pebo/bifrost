version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      semver-major-days: 5
      semver-minor-days: 3
      semver-patch-days: 2
    open-pull-requests-limit: 5
    groups:
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
      testing:
        patterns:
          - "github.com/stretchr/testify"

  # Docker images
  - package-ecosystem: "docker"
    directory: "/examples/docker-compose"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3

  # GitHub Actions (for when you add them)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
