version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
      testing:
        patterns:
          - "github.com/stretchr/testify"

  # Docker images
  - package-ecosystem: "docker"
    directory: "/examples/docker-compose"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  # GitHub Actions (for when you add them)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
