name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage
          path: coverage.txt

      - name: Coverage summary
        run: |
          echo "## Coverage" >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.txt | tail -n 1 >> $GITHUB_STEP_SUMMARY

  build:
    name: Build Binaries
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME="bifrost-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.VERSION }}" -o "${BINARY_NAME}" ./cmd/main.go

          # Create checksum
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            shasum -a 256 "${BINARY_NAME}" > "${BINARY_NAME}.sha256"
          else
            sha256sum "${BINARY_NAME}" > "${BINARY_NAME}.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bifrost-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bifrost-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract changelog
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          VERSION_NUMBER=${VERSION#v}

          # Check if CHANGELOG.md exists
          if [ ! -f CHANGELOG.md ]; then
            echo "⚠️ CHANGELOG.md not found, using default message"
            echo "Release $VERSION" > release_notes.md
            exit 0
          fi

          # Extract changelog for this version.
          # Avoid regex escaping issues by using string matching for the header line.
          CHANGELOG=$(awk -v ver="$VERSION_NUMBER" '
            $0 == "## [" ver "]" || index($0, "## [" ver "] - ") == 1 {flag=1; next}
            /^## \[/ && flag {exit}
            /^\[.*\]:/ && flag {exit}
            flag && NF {print}
          ' CHANGELOG.md)

          # Check if we got any content
          if [ -z "$CHANGELOG" ]; then
            echo "⚠️ No changelog entry found for version $VERSION_NUMBER"
            echo "Release $VERSION" > release_notes.md
          else
            echo "$CHANGELOG" > release_notes.md
            echo "✅ Extracted changelog for version $VERSION_NUMBER"
          fi

          # Debug: show what we extracted
          echo "--- Release Notes Content ---"
          cat release_notes.md
          echo "--- End Release Notes ---"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          body_path: release_notes.md
          files: |
            artifacts/bifrost-v*
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Go package listing
        run: |
          # Trigger pkg.go.dev to update (this is automatic, but we can force it)
          curl -s "https://proxy.golang.org/github.com/pebo/bifrost/@v/${{ steps.version.outputs.VERSION }}.info" || true
