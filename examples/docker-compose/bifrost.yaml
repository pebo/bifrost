server:
  port: 8080
  timeout: 15s
  max_body_size: 10485760  # 10MB (this is also the default if omitted)
  # Optional: Set your GCP project ID for trace correlation in Cloud Logging
  # gcp_project_id: "your-gcp-project-id"
  allowed_headers:
    - "Content-Type"
    - "X-Cloud-Trace-Context"
    - "Traceparent"
    - "X-Request-ID"

routes:
  - id: "dummy-service-get"
    path: "/hello/{name}"
    methods: ["GET"]
    target:
      url: "http://dummy-service:3000"
      path: "/hello/{name}"
  - id: "dummy-service-post"
    path: "/echo"
    methods: ["POST"]
    target:
      url: "http://dummy-service:3000"
      path: "/echo"
telemetry:
  enabled: true
  service_name: "bifrost-proxy"
  otel_collector:
    endpoint: "http://otel-collector:4318"
    gcp_auth: false
    timeout: "10s"
  metrics:
    enabled: true
